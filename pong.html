<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><title>Pong 3D</title>
<style>
  body { margin:0; overflow:hidden; background:#1a1d2e; font-family:system-ui,sans-serif; color:#fff; user-select:none; }
  #hud { position:fixed; top:16px; left:0; right:0; text-align:center; font-size:20px; pointer-events:none; text-shadow:0 2px 6px #000; }
  #score { position:fixed; top:52px; left:0; right:0; text-align:center; font-size:15px; opacity:.85; pointer-events:none; text-shadow:0 2px 6px #000; }
  #terug { position:fixed; top:16px; left:16px; color:#fff; text-decoration:none; background:rgba(255,255,255,.12); padding:6px 12px; border-radius:8px; font-size:14px; }
  #naam { position:fixed; top:16px; left:195px; display:flex; gap:6px; }
  #naam input { padding:6px 10px; border-radius:6px; border:0; font-size:14px; }
  #naam button { padding:6px 10px; border-radius:6px; border:0; cursor:pointer; }
  #mute { position:fixed; top:16px; right:16px; background:rgba(255,255,255,.12); border:0; color:#fff; font-size:20px; border-radius:8px; padding:6px 10px; cursor:pointer; }
  #reset { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:10px 22px; font-size:16px; border:0; border-radius:8px; background:#fff; color:#1a1d2e; cursor:pointer; display:none; }

  #pts { position:fixed; top:80px; left:0; right:0; text-align:center; font-size:48px; font-weight:800; pointer-events:none; text-shadow:0 3px 10px #000; letter-spacing:8px; }
  #keys { position:fixed; bottom:16px; left:16px; font-size:12px; opacity:.7; }
</style></head><body><script src="/kamer.js"></script>
<a id="terug" href="/" onclick="this.href='/'+location.search">‹ Menu</a><span style="position:fixed;top:17px;left:92px;font-size:13px;opacity:.75;background:rgba(0,0,0,.35);padding:5px 9px;border-radius:8px;z-index:3;pointer-events:none;text-shadow:none" id="kamerlbl"></span><script>(function(){document.getElementById("kamerlbl").textContent="kamer "+window.KAMER;})()</script>
<div id="hud">Verbinden…</div>
<div id="score"></div>
<div id="naam"><input id="naamIn" maxlength="14" placeholder="Jouw naam"><button id="naamOk">OK</button></div>
<button id="mute" title="Geluid aan/uit">🔊</button>
<button id="reset">Nieuw spel</button>

<div id="pts"></div>
<div id="keys">Muis bewegen of ↑↓ / W S</div>
<script type="importmap">{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
const GAME = 'pong';
// Gedeeld: geluid, naam, netwerk
let actx = null, muted = localStorage.getItem('mute') === '1';
const muteBtn = document.getElementById('mute'); muteBtn.textContent = muted ? '🔇' : '🔊';
muteBtn.onclick = () => { muted = !muted; localStorage.setItem('mute', muted ? '1' : '0'); muteBtn.textContent = muted ? '🔇' : '🔊'; };
function ac() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; }
addEventListener('pointerdown', () => ac(), { once: true }); addEventListener('keydown', () => ac(), { once: true });
function tone(freq, dur, type = 'sine', vol = 0.3, slide = 0, delay = 0) {
  if (muted || !actx) return; const c = actx; const t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
const sfxWin = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, 'triangle', 0.25, 0, i*0.12));
const sfxLose = () => [400, 330, 262].forEach((f, i) => tone(f, 0.4, 'sawtooth', 0.12, -30, i*0.2));
const sfxJoin = () => { tone(660, 0.1, 'sine', 0.2); tone(880, 0.15, 'sine', 0.2, 0, 0.1); };
const hud = document.getElementById('hud'), resetBtn = document.getElementById('reset');
let me = 0, state = null, prevState = null, full = false;
const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/?game=' + GAME + '&code=' + window.KAMER);
ws.onmessage = e => { const m = JSON.parse(e.data);
  if (m.type === 'welcome') { me = m.player; onWelcome(); const n = localStorage.getItem('naam'); if (n) { document.getElementById('naamIn').value = n; ws.send(JSON.stringify({ type: 'naam', naam: n })); } }
  if (m.type === 'full') { full = true; hud.textContent = 'Spel is vol: er zijn al 2 spelers verbonden.'; }
  if (m.type === 'state') { prevState = state; state = m; if (prevState && !(prevState.connected[0] && prevState.connected[1]) && m.connected[0] && m.connected[1]) sfxJoin(); applyState(m); } };
ws.onclose = () => { if (!full) hud.textContent = 'Verbinding verbroken. Ververs de pagina.'; };
document.getElementById('naamOk').onclick = () => { const n = document.getElementById('naamIn').value.trim(); if (!n) return; localStorage.setItem('naam', n); ws.send(JSON.stringify({ type: 'naam', naam: n })); };
document.getElementById('naamIn').onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') document.getElementById('naamOk').click(); };
document.getElementById('naamIn').onkeyup = e => e.stopPropagation();
resetBtn.onclick = () => ws.send(JSON.stringify({ type: 'reset' }));
const naamVan = (p, s) => (s.names && s.names[p-1]) ? s.names[p-1] + (p === me ? ' (jij)' : '') : (p === me ? 'jij' : 'vriend');

const W = 20, H = 12, PAD = 3;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0f1e);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(5, 15, 5); sun.castShadow = true; scene.add(sun);
const ballLight = new THREE.PointLight(0xffffff, 30, 12); scene.add(ballLight);
// ---------- Shaders & textures ----------
const clock = new THREE.Clock();
const uni = { uTime: { value: 0 }, uBall: { value: new THREE.Vector3() }, uHit: { value: 0 }, uHitPos: { value: new THREE.Vector3() }, uC1: { value: new THREE.Color(0xe63946) }, uC2: { value: new THREE.Color(0x4cc9f0) } };
// Procedurele textuur voor de tafel: hexraster met ruis
function hexTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 1024; const x = c.getContext('2d');
  x.fillStyle = '#0d1630'; x.fillRect(0, 0, 1024, 1024);
  const r = 28; x.strokeStyle = 'rgba(80,140,255,0.35)'; x.lineWidth = 2;
  for (let row = 0; row < 24; row++) for (let col = 0; col < 24; col++) {
    const cx = col * r * 1.75 + (row % 2) * r * 0.875, cy = row * r * 1.5; x.beginPath();
    for (let k = 0; k < 6; k++) { const a = Math.PI/3 * k + Math.PI/6; x.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } x.closePath(); x.stroke(); }
  for (let i = 0; i < 4000; i++) { x.fillStyle = `rgba(255,255,255,${Math.random() * 0.06})`; x.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 1.2); return t;
}
const tableMat = new THREE.ShaderMaterial({
  uniforms: { ...uni, uTex: { value: hexTexture() } },
  vertexShader: `varying vec2 vUv; varying vec3 vP; void main(){ vUv = uv; vP = (modelMatrix*vec4(position,1.0)).xyz; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D uTex; uniform float uTime; uniform vec3 uBall; uniform float uHit; uniform vec3 uHitPos; uniform vec3 uC1; uniform vec3 uC2; varying vec2 vUv; varying vec3 vP;
    void main(){
      vec3 base = texture2D(uTex, vUv).rgb;
      // scanlijn die over de tafel loopt
      float scan = smoothstep(0.02, 0.0, abs(fract(vP.x*0.05 - uTime*0.15) - 0.5) - 0.48) * 0.25;
      // gloed rond de bal
      float d = distance(vP.xz, uBall.xz);
      float glow = exp(-d*d*0.35) * 0.9;
      // schokgolf na een slag
      float hd = distance(vP.xz, uHitPos.xz);
      float ring = smoothstep(0.35, 0.0, abs(hd - (1.0-uHit)*9.0)) * uHit * 0.9;
      vec3 side = mix(uC1, uC2, smoothstep(-6.0, 6.0, vP.x));
      vec3 col = base + scan*side + glow*vec3(1.0) + ring*side;
      // middenlijn
      col += smoothstep(0.08, 0.0, abs(vP.x)) * vec3(0.4,0.6,1.0) * (0.6 + 0.4*sin(uTime*3.0));
      gl_FragColor = vec4(col, 1.0);
    }` });
const table = new THREE.Mesh(new THREE.PlaneGeometry(W + 2, H + 2), tableMat); table.rotation.x = -Math.PI/2; scene.add(table);
const tableBody = new THREE.Mesh(new THREE.BoxGeometry(W + 2.4, 0.6, H + 2.4), new THREE.MeshStandardMaterial({ color: 0x0a0f22, roughness: 0.4, metalness: 0.6 })); tableBody.position.y = -0.31; scene.add(tableBody);
// Wanden: glas met lichtlijn
const wallMat = new THREE.ShaderMaterial({ transparent: true, uniforms: uni,
  vertexShader: `varying vec3 vP; varying vec3 vN; void main(){ vP = (modelMatrix*vec4(position,1.0)).xyz; vN = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform float uTime; uniform vec3 uBall; uniform vec3 uC1; uniform vec3 uC2; varying vec3 vP; varying vec3 vN;
    void main(){ float d = distance(vP.xz, uBall.xz); float glow = exp(-d*d*0.2);
      vec3 side = mix(uC1, uC2, smoothstep(-6.0, 6.0, vP.x));
      float line = smoothstep(0.1, 0.0, abs(vP.y - 0.5 - 0.15*sin(vP.x*0.8 + uTime*2.0)));
      vec3 col = vec3(0.15,0.25,0.5)*0.5 + line*side*0.8 + glow*vec3(1.0)*0.8;
      gl_FragColor = vec4(col, 0.55 + glow*0.4); }` });
for (const z of [H/2 + 0.5, -H/2 - 0.5]) { const wall = new THREE.Mesh(new THREE.BoxGeometry(W + 2, 1.0, 0.3), wallMat); wall.position.set(0, 0.5, z); scene.add(wall); }
// Paddles: energie-shader met puls bij slag
function padMat(color, idx) { return new THREE.ShaderMaterial({ uniforms: { ...uni, uColor: { value: new THREE.Color(color) }, uIdx: { value: idx } },
  vertexShader: `varying vec3 vN; varying vec3 vV; varying vec3 vL; void main(){ vL = position; vN = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.0); vV = -mv.xyz; gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform vec3 uColor; uniform float uTime; uniform float uHit; uniform float uIdx; uniform vec3 uHitPos; varying vec3 vN; varying vec3 vV; varying vec3 vL;
    void main(){ vec3 N = normalize(vN), V = normalize(vV); float fres = pow(1.0 - max(dot(N,V),0.0), 2.0);
      float stripes = 0.5 + 0.5*sin(vL.z*12.0 - uTime*6.0);
      float pulse = uHit * step(0.5, 1.0 - abs(uHitPos.y - uIdx)) ; // alleen de paddle die sloeg
      vec3 col = uColor*(0.5 + 0.5*stripes) + fres*vec3(1.0)*0.8 + pulse*vec3(1.0);
      gl_FragColor = vec4(col, 1.0); }` }); }
const pads = [new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, PAD), padMat(0xe63946, 0)), new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, PAD), padMat(0x4cc9f0, 1))];
pads[0].position.set(-W/2 + 1.4, 0.4, 0); pads[1].position.set(W/2 - 1.4, 0.4, 0); pads.forEach(p => scene.add(p));
// Bal: plasma-fresnel
const ballMat = new THREE.ShaderMaterial({ uniforms: uni,
  vertexShader: `varying vec3 vN; varying vec3 vV; varying vec3 vL; void main(){ vL = position; vN = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.0); vV = -mv.xyz; gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform float uTime; varying vec3 vN; varying vec3 vV; varying vec3 vL;
    void main(){ vec3 N = normalize(vN), V = normalize(vV); float fres = pow(1.0 - max(dot(N,V),0.0), 1.5);
      float plasma = 0.5 + 0.5*sin(vL.x*14.0 + uTime*5.0) * sin(vL.y*14.0 - uTime*4.0) * sin(vL.z*14.0 + uTime*3.0);
      vec3 core = mix(vec3(1.0,0.95,0.8), vec3(0.6,0.9,1.0), plasma);
      gl_FragColor = vec4(core*(0.8 + 0.6*fres) + fres*vec3(0.5,0.8,1.0), 1.0); }` });
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 24), ballMat); ball.position.y = 0.4; scene.add(ball);
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'); const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,0.8)'); g.addColorStop(0.3, 'rgba(150,200,255,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); halo.scale.set(3, 3, 1); scene.add(halo);
const trail = []; for (let i = 0; i < 16; i++) { const t = new THREE.Mesh(new THREE.SphereGeometry(0.38 - i * 0.02, 12, 8), new THREE.MeshBasicMaterial({ color: 0x9fd3ff, transparent: true, opacity: 0.4 - i * 0.024, blending: THREE.AdditiveBlending, depthWrite: false })); scene.add(t); trail.push(t); }
// Vonken bij een slag
const sparks = []; const sparkGeo = new THREE.SphereGeometry(0.07, 6, 4);
function spawnSparks(pos, color) { for (let i = 0; i < 30; i++) { const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color })); m.position.copy(pos);
  m.userData.v = new THREE.Vector3((Math.random() - 0.5) * 10, Math.random() * 6, (Math.random() - 0.5) * 10); m.userData.life = 0.6; scene.add(m); sparks.push(m); } }

let camSide = 1;
function onWelcome() { camSide = me === 2 ? -1 : 1; }
function updateCamera() { camera.position.set(-camSide * 15, 11, 0.001); camera.lookAt(0, 0, 0); camera.up.set(0, 1, 0); }

let mouseZ = 0, keys = {}, kbZ = 0;
addEventListener('pointermove', e => {
  // project muis op tafelvlak
  const v = new THREE.Vector3((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1, 0.5).unproject(camera);
  const dir = v.sub(camera.position).normalize(); const t = -camera.position.y / dir.y; mouseZ = camera.position.z + dir.z * t; kbZ = mouseZ; });
addEventListener('keydown', e => keys[e.code] = true); addEventListener('keyup', e => keys[e.code] = false);
let sendT = 0, lastPts = [0, 0], lastHit = 0, lastWall = 0;
function applyState(s) {
  if (s.pts[0] !== lastPts[0] || s.pts[1] !== lastPts[1]) { const scorer = s.pts[0] !== lastPts[0] ? 1 : 2; tone(scorer === me ? 880 : 220, 0.3, 'square', 0.15); lastPts = [...s.pts]; }
  if ((s.ball.hit || 0) !== lastHit) { lastHit = s.ball.hit || 0; const sp = Math.hypot(s.ball.vx, s.ball.vz); tone(400 + sp * 12, 0.07, 'square', 0.18);
    uni.uHit.value = 1; uni.uHitPos.value.set(s.ball.x, s.ball.hitSide || 0, s.ball.z); spawnSparks(new THREE.Vector3(s.ball.x, 0.4, s.ball.z), s.ball.hitSide ? 0x4cc9f0 : 0xe63946); }
  if ((s.ball.wall || 0) !== lastWall) { lastWall = s.ball.wall || 0; tone(260, 0.05, 'triangle', 0.12); }
  if (prevState && !prevState.winner && s.winner) (s.winner === me ? sfxWin : sfxLose)();
  document.getElementById('pts').textContent = s.pts[0] + ' : ' + s.pts[1];
  const both = s.connected[0] && s.connected[1];
  const dot = p => `<b style="display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:6px;background:${p === 1 ? '#e63946' : '#4cc9f0'}"></b>`;
  if (!both) hud.innerHTML = `Jij bent ${dot(me)}speler ${me} (${me === 1 ? 'links' : 'rechts'}). Wachten op tegenstander…`;
  else if (s.winner) hud.innerHTML = `${dot(s.winner)}${s.winner === me ? 'Jij wint! 🎉' : naamVan(s.winner, s) + ' wint.'}`;
  else hud.innerHTML = s.now < s.serveAt ? 'Klaar…' : `Eerste tot 7 · ${Math.round(Math.hypot(s.ball.vx, s.ball.vz) * 3.6)} km/u`;
  document.getElementById('score').innerHTML = `🔴 ${s.names[0] || 'Speler 1'}: ${s.score[0]} &nbsp;·&nbsp; 🔵 ${s.names[1] || 'Speler 2'}: ${s.score[1]}`;
  resetBtn.style.display = s.winner ? 'block' : 'none';
}
const target = new THREE.Vector3(); let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; updateCamera();
  if (keys.ArrowUp || keys.KeyW) kbZ -= 14 * dt * camSide; if (keys.ArrowDown || keys.KeyS) kbZ += 14 * dt * camSide;
  kbZ = Math.max(-H/2 + PAD/2, Math.min(H/2 - PAD/2, kbZ));
  sendT += dt; if (sendT > 0.04 && ws.readyState === 1 && me) { sendT = 0; ws.send(JSON.stringify({ type: 'pad', z: +kbZ.toFixed(2) })); }
  if (state) {
    pads[0].position.z += (state.pad[0] - pads[0].position.z) * Math.min(1, dt * 15); pads[1].position.z += (state.pad[1] - pads[1].position.z) * Math.min(1, dt * 15);
    if (me) pads[me-1].position.z = kbZ; // eigen paddle direct
    target.set(state.ball.x, 0.4, state.ball.z); ball.position.lerp(target, Math.min(1, dt * 20));
    for (let i = trail.length - 1; i > 0; i--) trail[i].position.lerp(trail[i-1].position, 0.6); trail[0].position.copy(ball.position);
    ballLight.position.copy(ball.position).setY(2); halo.position.copy(ball.position);
    uni.uBall.value.copy(ball.position); uni.uTime.value = clock.getElapsedTime(); uni.uHit.value = Math.max(0, uni.uHit.value - dt * 2.2);
    for (let i = sparks.length - 1; i >= 0; i--) { const m = sparks[i]; m.userData.v.y -= 20 * dt; m.position.addScaledVector(m.userData.v, dt); m.userData.life -= dt; m.scale.setScalar(Math.max(0.01, m.userData.life / 0.6)); if (m.userData.life <= 0 || m.position.y < 0) { scene.remove(m); sparks.splice(i, 1); } }
  }
  renderer.render(scene, camera); requestAnimationFrame(loop);
}
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
requestAnimationFrame(loop);
</script></body></html>

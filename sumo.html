<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><title>Sumo 3D</title>
<style>
  body { margin:0; overflow:hidden; background:#1a1d2e; font-family:system-ui,sans-serif; color:#fff; user-select:none; }
  #hud { position:fixed; top:16px; left:0; right:0; text-align:center; font-size:20px; pointer-events:none; text-shadow:0 2px 6px #000; }
  #score { position:fixed; top:52px; left:0; right:0; text-align:center; font-size:15px; opacity:.85; pointer-events:none; text-shadow:0 2px 6px #000; }
  #terug { position:fixed; top:16px; left:16px; color:#fff; text-decoration:none; background:rgba(255,255,255,.12); padding:6px 12px; border-radius:8px; font-size:14px; z-index:3; }
  #naam { position:fixed; top:16px; left:195px; display:flex; gap:6px; z-index:3; }
  #naam input { padding:6px 10px; border-radius:6px; border:0; font-size:14px; }
  #naam button, .btn { padding:6px 12px; border-radius:6px; border:0; cursor:pointer; font-size:14px; }
  #mute { position:fixed; top:16px; right:16px; background:rgba(255,255,255,.12); border:0; color:#fff; font-size:20px; border-radius:8px; padding:6px 10px; cursor:pointer; z-index:3; }
  #reset { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:10px 22px; font-size:16px; border:0; border-radius:8px; background:#fff; color:#1a1d2e; cursor:pointer; display:none; z-index:3; }
  #panel { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:8px; align-items:center; background:rgba(0,0,0,.4); padding:10px 14px; border-radius:12px; z-index:3; }
  #panel:empty { display:none; }
  #keys { position:fixed; bottom:16px; left:16px; font-size:12px; opacity:.7; text-shadow:0 1px 4px #000; }
  #center { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; pointer-events:none; text-align:center; text-shadow:0 4px 14px #000; }
  #center .t { font-size:80px; font-weight:800; } #center .s { font-size:22px; }

</style></head><body><script src="/kamer.js"></script>
<a id="terug" href="/" onclick="this.href='/'+location.search">‹ Menu</a><span style="position:fixed;top:17px;left:92px;font-size:13px;opacity:.75;background:rgba(0,0,0,.35);padding:5px 9px;border-radius:8px;z-index:3;pointer-events:none;text-shadow:none" id="kamerlbl"></span><script>(function(){document.getElementById("kamerlbl").textContent="kamer "+window.KAMER;})()</script>
<div id="hud">Verbinden…</div>
<div id="score"></div>
<div id="naam"><input id="naamIn" maxlength="14" placeholder="Jouw naam"><button id="naamOk">OK</button></div>
<button id="mute" title="Geluid aan/uit">🔊</button>
<button id="reset">Nieuw spel</button>
<div id="panel"></div>
<div id="center"></div>
<div id="keys"></div>
<script type="importmap">{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
const GAME = 'sumo', BG = 0x0b1220, KEYS = 'Pijltjes of WASD · duw de ander van het platform · eerste tot 3';

let actx = null, muted = localStorage.getItem('mute') === '1';
const muteBtn = document.getElementById('mute'); muteBtn.textContent = muted ? '🔇' : '🔊';
muteBtn.onclick = () => { muted = !muted; localStorage.setItem('mute', muted ? '1' : '0'); muteBtn.textContent = muted ? '🔇' : '🔊'; };
function ac() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; }
addEventListener('pointerdown', () => ac(), { once: true }); addEventListener('keydown', () => ac(), { once: true });
function tone(freq, dur, type = 'sine', vol = 0.3, slide = 0, delay = 0) {
  if (muted || !actx) return; const c = actx; const t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
const sfxWin = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, 'triangle', 0.25, 0, i*0.12));
const sfxLose = () => [400, 330, 262].forEach((f, i) => tone(f, 0.4, 'sawtooth', 0.12, -30, i*0.2));
const sfxJoin = () => { tone(660, 0.1, 'sine', 0.2); tone(880, 0.15, 'sine', 0.2, 0, 0.1); };
const click = () => tone(600, 0.05, 'square', 0.08);
const hud = document.getElementById('hud'), resetBtn = document.getElementById('reset'), panel = document.getElementById('panel'), center = document.getElementById('center');
const setCenter = h => { if (center.dataset.h !== h) { center.dataset.h = h; center.innerHTML = h; } };
const setPanel = h => { if (panel.dataset.h !== h) { panel.dataset.h = h; panel.innerHTML = h; } };
document.getElementById('keys').textContent = KEYS;
let me = 0, state = null, prevState = null, full = false;
const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/?game=' + GAME + '&code=' + window.KAMER);
const send = o => ws.readyState === 1 && ws.send(JSON.stringify(o));
ws.onmessage = e => { const m = JSON.parse(e.data);
  if (m.type === 'welcome') { me = m.player; if (typeof onWelcome === 'function') onWelcome(); const n = localStorage.getItem('naam'); if (n) { document.getElementById('naamIn').value = n; send({ type: 'naam', naam: n }); } }
  else if (m.type === 'full') { full = true; hud.textContent = 'Spel is vol: er zijn al 2 spelers verbonden.'; }
  else if (m.type === 'state') { prevState = state; state = m; if (prevState && !(prevState.connected[0] && prevState.connected[1]) && m.connected[0] && m.connected[1]) sfxJoin();
    if (prevState && !prevState.winner && m.winner) { if (m.winner === 3) tone(440, 0.5, 'sine', 0.2); else (m.winner === me ? sfxWin : sfxLose)(); }
    resetBtn.style.display = m.winner ? 'block' : 'none'; applyState(m); }
  else if (typeof onOther === 'function') onOther(m); };
ws.onclose = () => { if (!full) hud.textContent = 'Verbinding verbroken. Ververs de pagina.'; };
document.getElementById('naamOk').onclick = () => { const n = document.getElementById('naamIn').value.trim(); if (!n) return; localStorage.setItem('naam', n); send({ type: 'naam', naam: n }); };
for (const ev of ['keydown', 'keyup']) document.getElementById('naamIn').addEventListener(ev, e => { e.stopPropagation(); if (ev === 'keydown' && e.key === 'Enter') document.getElementById('naamOk').click(); });
resetBtn.onclick = () => send({ type: 'reset' });
const naamVan = (p, s) => (s.names && s.names[p-1]) ? s.names[p-1] + (p === me ? ' (jij)' : '') : (p === me ? 'jij' : 'vriend');
const both = s => s.connected[0] && s.connected[1];
const dot = (p, c1 = '#e63946', c2 = '#4cc9f0') => `<b style="display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:6px;background:${p === 1 ? c1 : c2}"></b>`;
function stdHud(s, extra) { if (!both(s)) hud.innerHTML = `Jij bent ${dot(me)}speler ${me}. Wachten op tegenstander…`;
  else if (s.winner === 3) hud.innerHTML = 'Gelijkspel!'; else if (s.winner) hud.innerHTML = `${dot(s.winner)}${s.winner === me ? 'Jij wint! 🎉' : naamVan(s.winner, s) + ' wint.'}`;
  else hud.innerHTML = extra || `${dot(s.turn)}Aan de beurt: ${naamVan(s.turn, s)}`;
  document.getElementById('score').innerHTML = `${dot(1)}${s.names[0] || 'Speler 1'}: ${s.score[0]} &nbsp;·&nbsp; ${dot(2)}${s.names[1] || 'Speler 2'}: ${s.score[1]}`; }
// 3D basis
const scene = new THREE.Scene(); scene.background = new THREE.Color(BG);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(8, 16, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30 }); scene.add(sun);
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function pick(e, objs) { mouse.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse, camera); return ray.intersectObjects(objs, true)[0]; }
function groundPoint(e, y = 0) { mouse.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse, camera); const t = (y - ray.ray.origin.y) / ray.ray.direction.y; return ray.ray.origin.clone().addScaledVector(ray.ray.direction, t); }
const std = (c, r = 0.4, m = 0.1) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
function textSprite(text, color = '#fff', size = 4) { const c = document.createElement('canvas'); c.width = 512; c.height = 128; const x = c.getContext('2d'); x.font = 'bold 80px system-ui'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = color; x.fillText(text, 256, 64);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false })); s.scale.set(size, size/4, 1); return s; }
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
let _last = performance.now();
function _loop(now) { const dt = Math.min(0.05, (now - _last) / 1000); _last = now; if (typeof tick === 'function') tick(dt, now); renderer.render(scene, camera); requestAnimationFrame(_loop); }
requestAnimationFrame(_loop);


camera.position.set(0, 22, 18); camera.lookAt(0, 0, 0);
const platform = new THREE.Mesh(new THREE.CylinderGeometry(9, 9.5, 1, 64), std(0xd9b38c, 0.8)); platform.position.y = -0.5; platform.receiveShadow = true; scene.add(platform);
const ring = new THREE.Mesh(new THREE.TorusGeometry(8.6, 0.15, 8, 64), std(0x7a1f1f)); ring.rotation.x = Math.PI/2; ring.position.y = 0.02; scene.add(ring);
const lava = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShaderMaterial({ uniforms: { uTime: { value: 0 } }, vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform float uTime; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5); } float n(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y); }
  void main(){ float v = n(vUv*12.0 + uTime*0.2) * 0.6 + n(vUv*30.0 - uTime*0.3) * 0.4; vec3 c = mix(vec3(0.5,0.05,0.0), vec3(1.0,0.6,0.1), smoothstep(0.4,0.8,v)); gl_FragColor = vec4(c, 1.0); }` })); lava.rotation.x = -Math.PI/2; lava.position.y = -4; scene.add(lava);
const balls = [0xe63946, 0x4cc9f0].map(c => { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), std(c, 0.3, 0.3)); m.position.y = 1; m.castShadow = true; scene.add(m); return m; });
let lastHit = 0;
function applyState(s) {
  platform.scale.set(s.radius / 9, 1, s.radius / 9); ring.scale.set(s.radius / 9, s.radius / 9, 1);
  if ((s.b.hit || 0) !== lastHit) { lastHit = s.b.hit || 0; tone(200, 0.08, 'square', 0.2); }
  if (prevState && prevState.phase === 'play' && s.phase !== 'play') tone(100, 0.6, 'sawtooth', 0.3, -60);
  stdHud(s, `Rondes: <span style="color:#e63946">${s.rounds[0]}</span> – <span style="color:#4cc9f0">${s.rounds[1]}</span> · jij bent ${dot(me)}${me === 1 ? 'rood' : 'blauw'}`);
  if (s.phase === 'countdown') setCenter(`<div class="t">${Math.max(1, Math.ceil((s.startAt - s.now) / 1000))}</div>`); else if (s.phase === 'roundover') setCenter('<div class="s">Ronde voorbij!</div>'); else setCenter('');
}
const keys = {}; addEventListener('keydown', e => { keys[e.code] = true; if (e.code.startsWith('Arrow')) e.preventDefault(); }); addEventListener('keyup', e => keys[e.code] = false);
let sendT = 0; const tgt = new THREE.Vector3();
function tick(dt, now) { lava.material.uniforms.uTime.value = now / 1000; sendT += dt;
  if (sendT > 0.05) { sendT = 0; const x = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0), z = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0); send({ type: 'input', x, z }); }
  if (state) state.b.forEach((b, i) => { const out = Math.hypot(b.x, b.z) > state.radius + 0.5; tgt.set(b.x, out ? -3 : 1, b.z); balls[i].position.lerp(tgt, Math.min(1, dt * 20)); balls[i].rotation.x += b.vz * dt; balls[i].rotation.z -= b.vx * dt; }); }

</script></body></html>

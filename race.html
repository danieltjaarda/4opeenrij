<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Kart Race 3D</title>
<style>
  body { margin:0; overflow:hidden; background:#87ceeb; font-family:system-ui,sans-serif; color:#fff; user-select:none; }
  #terug { position:fixed; top:16px; left:16px; color:#fff; text-decoration:none; background:rgba(0,0,0,.35); padding:6px 12px; border-radius:8px; font-size:14px; z-index:2; }
  #naam { position:fixed; top:16px; left:195px; display:flex; gap:6px; z-index:2; }
  #naam input { padding:6px 10px; border-radius:6px; border:0; font-size:14px; }
  #naam button { padding:6px 10px; border-radius:6px; border:0; cursor:pointer; }
  #mute { position:fixed; top:16px; right:16px; background:rgba(0,0,0,.35); border:0; color:#fff; font-size:20px; border-radius:8px; padding:6px 10px; cursor:pointer; z-index:2; }
  #hud { position:fixed; top:60px; left:16px; font-size:16px; text-shadow:0 2px 6px #000; line-height:1.5; }
  #hud .big { font-size:34px; font-weight:700; }
  #rank { position:fixed; top:60px; right:16px; background:rgba(0,0,0,.35); padding:10px 14px; border-radius:10px; font-size:14px; min-width:170px; }
  #rank div { display:flex; gap:8px; align-items:center; padding:2px 0; }
  #rank i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  #rank .me { font-weight:700; color:#ffe66d; }
  #center { position:fixed; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; flex-direction:column; pointer-events:none; text-align:center; text-shadow:0 4px 14px #000; }
  #center .t { font-size:90px; font-weight:800; }
  #center .s { font-size:22px; opacity:.9; }
  #speed { position:fixed; bottom:20px; right:24px; font-size:40px; font-weight:800; text-shadow:0 2px 8px #000; }
  #speed small { font-size:14px; font-weight:400; }
  #keys { position:fixed; bottom:16px; left:16px; font-size:12px; opacity:.75; text-shadow:0 1px 4px #000; }
  button.act { pointer-events:auto; margin-top:16px; padding:10px 22px; font-size:16px; border:0; border-radius:8px; background:#fff; color:#223; cursor:pointer; }
</style>
</head>
<body><script src="/kamer.js"></script>
<a id="terug" href="/" onclick="this.href='/'+location.search">‹ Menu</a><span style="position:fixed;top:17px;left:92px;font-size:13px;opacity:.75;background:rgba(0,0,0,.35);padding:5px 9px;border-radius:8px;z-index:3;pointer-events:none;text-shadow:none" id="kamerlbl"></span><script>(function(){document.getElementById("kamerlbl").textContent="kamer "+window.KAMER;})()</script>
<div id="naam"><input id="naamIn" maxlength="14" placeholder="Jouw naam"><button id="naamOk">OK</button></div>
<button id="mute" title="Geluid aan/uit">🔊</button>
<div id="hud"></div>
<div id="rank"></div>
<div id="center"></div>
<div id="speed"></div>
<div id="keys">Pijltjes / WASD sturen en gas · Shift of spatie = drift</div>
<script src="/track.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
const T = window.TRACK, LAPS = T.LAPS;
const PLAYER_COLORS = [0xe63946, 0x4361ee];

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 120, 420);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x447744, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(80, 140, 60); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -200, right: 200, top: 200, bottom: -200, far: 500 });
scene.add(sun);

// Grond
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshStandardMaterial({ color: 0x5aa84a, roughness: 1 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.05; ground.receiveShadow = true; scene.add(ground);

// Weg als lint
function ribbon(halfW, y, color, inner = 0) {
  const pos = [], idx = [], n = T.samples.length;
  for (let i = 0; i < n; i++) { const s = T.samples[i];
    pos.push(s.x + s.nx*inner, y, s.z + s.nz*inner, s.x + s.nx*halfW, y, s.z + s.nz*halfW); }
  for (let i = 0; i < n; i++) { const a = i*2, b = ((i+1)%n)*2; idx.push(a, b, a+1, a+1, b, b+1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, roughness: 0.9, side: THREE.DoubleSide })); m.receiveShadow = true; return m;
}
const hw = T.WIDTH/2;
scene.add(ribbon(hw, 0, 0x3a3a40, -hw));
// Stoepranden (rood/wit blokjes)
const curbGeo = new THREE.BoxGeometry(T.STEP, 0.2, 0.8);
const curbMats = [new THREE.MeshStandardMaterial({ color: 0xe63946 }), new THREE.MeshStandardMaterial({ color: 0xf1faee })];
T.samples.forEach((s, i) => { for (const side of [1, -1]) {
  const c = new THREE.Mesh(curbGeo, curbMats[(i >> 1) & 1]); c.position.set(s.x + s.nx*side*(hw+0.4), 0.05, s.z + s.nz*side*(hw+0.4));
  c.rotation.y = -Math.atan2(s.dz, s.dx); scene.add(c); } });
// Startlijn + boog
const st = T.pointAt(0);
const line = new THREE.Mesh(new THREE.PlaneGeometry(T.WIDTH, 2.5), new THREE.MeshBasicMaterial({ color: 0xffffff }));
line.rotation.x = -Math.PI/2; line.rotation.z = Math.atan2(-st.dx, -st.dz); line.position.set(st.x, 0.02, st.z); scene.add(line);
const arch = new THREE.Group();
const pillarGeo = new THREE.CylinderGeometry(0.4, 0.4, 9), pillarMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
for (const side of [1, -1]) { const p = new THREE.Mesh(pillarGeo, pillarMat); p.position.set(side*(hw+1.2), 4.5, 0); p.castShadow = true; arch.add(p); }
const banner = new THREE.Mesh(new THREE.BoxGeometry(T.WIDTH+3.5, 1.6, 0.4), new THREE.MeshStandardMaterial({ color: 0xe63946 })); banner.position.y = 9; arch.add(banner);
arch.position.set(st.x, 0, st.z); arch.rotation.y = Math.atan2(st.dx, st.dz); scene.add(arch);
// Boostpads
const padMat = new THREE.MeshBasicMaterial({ color: 0xffa500 });
const pads = T.BOOSTS.map(d => { const p = T.pointAt(d); const m = new THREE.Mesh(new THREE.PlaneGeometry(T.WIDTH*0.7, 4), padMat.clone());
  m.rotation.x = -Math.PI/2; m.rotation.z = Math.atan2(-p.dx, -p.dz); m.position.set(p.x, 0.03, p.z); scene.add(m); return { d, m }; });
// Bomen langs de baan
const treeTrunk = new THREE.CylinderGeometry(0.3, 0.4, 2), treeTop = new THREE.ConeGeometry(2, 5, 8);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4423 }), topMat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f });
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < T.samples.length; i += 9) { const s = T.samples[i]; const side = rnd() < 0.5 ? 1 : -1, off = hw + 6 + rnd() * 14;
  const g = new THREE.Group(); const tr = new THREE.Mesh(treeTrunk, trunkMat); tr.position.y = 1; const tp = new THREE.Mesh(treeTop, topMat); tp.position.y = 4.5; tp.castShadow = true;
  g.add(tr, tp); g.position.set(s.x + s.nx*side*off, 0, s.z + s.nz*side*off); g.scale.setScalar(0.8 + rnd()*0.7); scene.add(g); }

// ---------- Karts ----------
function makeKart(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 2.6), new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.2 })); body.position.y = 0.55; body.castShadow = true; g.add(body);
  const nose = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.3, 0.8), body.material); nose.position.set(0, 0.5, 1.6); g.add(nose);
  const seat = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: 0x222222 })); seat.position.set(0, 1.0, -0.5); g.add(seat);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffd9b3 })); head.position.set(0, 1.5, -0.2); g.add(head);
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.44, 16, 12, 0, Math.PI*2, 0, Math.PI/2), body.material); helmet.position.copy(head.position); g.add(helmet);
  const wGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16), wMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  g.userData.wheels = [[-0.9, 0.9], [0.9, 0.9], [-0.9, -0.9], [0.9, -0.9]].map(([x, z]) => { const w = new THREE.Mesh(wGeo, wMat); w.rotation.z = Math.PI/2; w.position.set(x, 0.4, z); w.castShadow = true; g.add(w); return w; });
  scene.add(g); return g;
}
const botMeshes = [], labelSprites = [];
function label(text, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64; const x = c.getContext('2d');
  x.font = 'bold 36px system-ui'; x.textAlign = 'center'; x.fillStyle = 'rgba(0,0,0,.5)'; x.fillRect(0, 0, 256, 64); x.fillStyle = '#' + color.toString(16).padStart(6, '0'); x.fillText(text, 128, 44);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false })); s.scale.set(5, 1.25, 1); s.position.y = 2.6; return s;
}
const myKart = { x: 0, z: 0, rot: 0, speed: 0, steer: 0, lap: 0, hint: 0, dist: 0, lastDist: 0, passedHalf: false, boost: 0, offTrack: false, finished: false };
const myMesh = makeKart(0xffffff), otherMesh = makeKart(0xffffff); otherMesh.visible = false;
let otherLabel = null;

// ---------- Geluid ----------
let actx = null, muted = localStorage.getItem('mute') === '1', engine = null, engineGain = null;
const muteBtn = document.getElementById('mute'); muteBtn.textContent = muted ? '🔇' : '🔊';
muteBtn.onclick = () => { muted = !muted; localStorage.setItem('mute', muted ? '1' : '0'); muteBtn.textContent = muted ? '🔇' : '🔊'; if (engineGain) engineGain.gain.value = muted ? 0 : 0.08; };
function ac() { if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)();
  engine = actx.createOscillator(); engine.type = 'sawtooth'; const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600;
  engineGain = actx.createGain(); engineGain.gain.value = muted ? 0 : 0.08; engine.connect(f).connect(engineGain).connect(actx.destination); engine.start(); }
  if (actx.state === 'suspended') actx.resume(); return actx; }
addEventListener('keydown', () => ac(), { once: true }); addEventListener('pointerdown', () => ac(), { once: true });
function tone(freq, dur, type = 'sine', vol = 0.3, slide = 0, delay = 0) {
  if (muted || !actx) return; const c = actx; const t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
const sfx = { beep: () => tone(440, 0.15, 'square', 0.15), go: () => tone(880, 0.4, 'square', 0.18), boost: () => tone(300, 0.4, 'sawtooth', 0.15, 900),
  lap: () => [660, 880].forEach((f, i) => tone(f, 0.15, 'triangle', 0.2, 0, i*0.1)), bump: () => tone(90, 0.1, 'square', 0.2, -40),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, 'triangle', 0.25, 0, i*0.12)), finish: () => [523, 523, 784].forEach((f, i) => tone(f, 0.25, 'triangle', 0.2, 0, i*0.15)) };

// ---------- Netwerk ----------
let me = 0, state = null, full = false, lastPhase = 'wait', countShown = -1;
const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/?game=race&code=' + window.KAMER);
ws.onmessage = e => { const m = JSON.parse(e.data);
  if (m.type === 'welcome') { me = m.player; myMesh.children[0].material.color.setHex(PLAYER_COLORS[me-1]); placeAtStart();
    const n = localStorage.getItem('naam'); if (n) { document.getElementById('naamIn').value = n; ws.send(JSON.stringify({ type: 'naam', naam: n })); } }
  if (m.type === 'full') { full = true; document.getElementById('center').innerHTML = '<div class="s">Race is vol: er zijn al 2 spelers verbonden.</div>'; }
  if (m.type === 'state') onState(m); };
ws.onclose = () => { if (!full) document.getElementById('center').innerHTML = '<div class="s">Verbinding verbroken. Ververs de pagina.</div>'; };
document.getElementById('naamOk').onclick = () => { const n = document.getElementById('naamIn').value.trim(); if (!n) return; localStorage.setItem('naam', n); ws.send(JSON.stringify({ type: 'naam', naam: n })); };
document.getElementById('naamIn').onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') document.getElementById('naamOk').click(); };
document.getElementById('naamIn').onkeyup = e => e.stopPropagation();

function placeAtStart() { const p = T.pointAt(-10 - (me-1)*6, me === 1 ? -3 : 3);
  Object.assign(myKart, { x: p.x, z: p.z, rot: Math.atan2(p.dx, p.dz), speed: 0, lap: 0, hint: T.samples.length - 10, dist: 0, passedHalf: false, boost: 0, finished: false }); }

function onState(s) {
  const prev = state; state = s;
  if (s.phase === 'wait' && prev && prev.phase !== 'wait') placeAtStart();
  if (s.phase === 'countdown' && lastPhase !== 'countdown') placeAtStart();
  if (s.phase === 'race' && lastPhase !== 'race') { sfx.go(); }
  if (s.phase === 'done' && lastPhase !== 'done') { const w = s.order[0]; if (w && w.player === me) sfx.win(); }
  lastPhase = s.phase;
  // Bots
  s.bots.forEach((b, i) => { if (!botMeshes[i]) { botMeshes[i] = makeKart(b.color); botMeshes[i].add(label(b.name, b.color)); }
    const p = T.pointAt(b.dist, b.lateral); const m = botMeshes[i]; m.userData.target = new THREE.Vector3(p.x, 0, p.z); m.userData.rot = Math.atan2(p.dx, p.dz); if (!m.userData.init) { m.position.copy(m.userData.target); m.userData.init = true; } });
  // Andere speler
  const o = s.karts[2 - me]; const oName = s.names[2 - me] || 'Speler ' + (3 - me);
  if (o) { otherMesh.visible = true; otherMesh.children[0].material.color.setHex(PLAYER_COLORS[2-me]); otherMesh.userData.target = new THREE.Vector3(o.x, 0, o.z); otherMesh.userData.rot = o.rot;
    if (!otherLabel || otherLabel.userData.n !== oName) { if (otherLabel) otherMesh.remove(otherLabel); otherLabel = label(oName, PLAYER_COLORS[2-me]); otherLabel.userData.n = oName; otherMesh.add(otherLabel); } }
  else otherMesh.visible = false;
  renderHud();
}

// ---------- Besturing & fysica ----------
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (['ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup', e => keys[e.code] = false);
const MAX = 34, ACCEL = 22, BRAKE = 30, FRICTION = 6;
function physics(dt) {
  const racing = state && state.phase === 'race' && !myKart.finished;
  const up = keys.ArrowUp || keys.KeyW, down = keys.ArrowDown || keys.KeyS, left = keys.ArrowLeft || keys.KeyA, right = keys.ArrowRight || keys.KeyD, drift = keys.ShiftLeft || keys.ShiftRight || keys.Space;
  const near = T.nearest(myKart.x, myKart.z, myKart.hint); myKart.hint = near.index; myKart.offTrack = near.offTrack;
  const max = (myKart.offTrack ? MAX * 0.45 : MAX) + myKart.boost * 14;
  if (racing && up) myKart.speed += ACCEL * dt; else if (racing && down) myKart.speed -= BRAKE * dt; else myKart.speed -= Math.sign(myKart.speed) * Math.min(Math.abs(myKart.speed), FRICTION * dt);
  if (myKart.speed > max) myKart.speed -= (myKart.speed - max) * dt * 3;
  myKart.speed = Math.max(-10, myKart.speed);
  const steerIn = (left ? 1 : 0) - (right ? 1 : 0);
  myKart.steer += (steerIn - myKart.steer) * dt * 10;
  const grip = drift ? 2.2 : 1.4;
  myKart.rot += myKart.steer * grip * dt * Math.min(1, Math.abs(myKart.speed) / 12) * Math.sign(myKart.speed || 1);
  myKart.x += Math.sin(myKart.rot) * myKart.speed * dt; myKart.z += Math.cos(myKart.rot) * myKart.speed * dt;
  myKart.boost = Math.max(0, myKart.boost - dt);
  // Boostpads
  for (const p of pads) { const dd = Math.abs(((near.dist - p.d) % T.LEN + T.LEN) % T.LEN); if ((dd < 3 || dd > T.LEN - 3) && Math.abs(near.lateral) < T.WIDTH*0.35 && myKart.boost < 0.2) { myKart.boost = 1.6; myKart.speed += 8; sfx.boost(); } }
  // Botsen met andere karts (zachte afstoting)
  const others = [...botMeshes, otherMesh].filter(m => m.visible);
  for (const m of others) { const dx = myKart.x - m.position.x, dz = myKart.z - m.position.z, d = Math.hypot(dx, dz);
    if (d < 2.2 && d > 0.01) { const push = (2.2 - d); myKart.x += dx/d * push; myKart.z += dz/d * push; if (Math.abs(myKart.speed) > 8) { myKart.speed *= 0.8; sfx.bump(); } } }
  // Ronden tellen: kwart/halverwege gepasseerd, dan weer langs start
  const d = near.dist;
  if (d > T.LEN * 0.4 && d < T.LEN * 0.6) myKart.passedHalf = true;
  if (racing && myKart.lastDist > T.LEN * 0.9 && d < T.LEN * 0.1 && myKart.passedHalf) { myKart.lap++; myKart.passedHalf = false; if (myKart.lap >= LAPS) { myKart.finished = true; sfx.finish(); } else sfx.lap(); }
  if (myKart.lastDist < T.LEN * 0.1 && d > T.LEN * 0.9 && myKart.lap > 0 && !myKart.passedHalf) { /* achteruit over de lijn */ myKart.lap--; myKart.passedHalf = true; }
  myKart.lastDist = d; myKart.dist = d;
  if (engine) engine.frequency.value = 60 + Math.abs(myKart.speed) * 6 + (myKart.boost > 0 ? 80 : 0);
}
let sendT = 0;
function send(dt) { sendT += dt; if (sendT < 0.05 || ws.readyState !== 1) return; sendT = 0;
  ws.send(JSON.stringify({ type: 'kart', x: +myKart.x.toFixed(2), z: +myKart.z.toFixed(2), rot: +myKart.rot.toFixed(3), speed: +myKart.speed.toFixed(1), lap: myKart.lap, dist: Math.round(myKart.dist) })); }

// ---------- HUD ----------
function ranking() {
  if (!state) return [];
  const list = [];
  state.bots.forEach((b, i) => list.push({ name: b.name, color: b.color, prog: b.dist, lap: b.lap, finished: b.finished, bot: i }));
  state.karts.forEach((k, i) => { if (!k && i + 1 !== me) return; const mine = i + 1 === me;
    const lap = mine ? myKart.lap : k.lap, dist = mine ? myKart.dist : k.dist; list.push({ name: mine ? (state.names[i] || 'Jij') : k.name, color: PLAYER_COLORS[i], prog: lap * T.LEN + dist, lap, finished: mine ? myKart.finished : k.finished, me: mine }); });
  const pos = o => o.finished ? 1e9 - (state.order.findIndex(x => x.name === o.name) + 1) : o.prog;
  return list.sort((a, b) => pos(b) - pos(a));
}
function renderHud() {
  const r = ranking(), myPos = r.findIndex(x => x.me) + 1;
  document.getElementById('rank').innerHTML = r.map((x, i) => `<div class="${x.me ? 'me' : ''}"><span>${i+1}.</span><i style="background:#${x.color.toString(16).padStart(6,'0')}"></i>${x.name}${x.finished ? ' 🏁' : ''}</div>`).join('');
  document.getElementById('hud').innerHTML = `<div class="big">${myPos}<small>/${r.length}</small></div>Ronde ${Math.min(myKart.lap + 1, LAPS)}/${LAPS}${myKart.offTrack ? '<br>🌱 Van de baan!' : ''}${myKart.boost > 0 ? '<br>🔥 Boost!' : ''}`;
  const cEl = document.getElementById('center');
  const c = { set innerHTML(v) { if (cEl.dataset.h !== v) { cEl.dataset.h = v; cEl.innerHTML = v; } } };
  if (!state) return;
  const both = state.connected[0] && state.connected[1];
  if (state.phase === 'wait') c.innerHTML = `<div class="s">${both ? 'Race start zo…' : 'Wachten op tegenstander…'}</div>${both ? '' : '<button class="act" id="solo">Start alleen tegen de bots</button>'}`;
  else if (state.phase === 'countdown') { const n = Math.ceil((state.startAt - state.now) / 1000); c.innerHTML = `<div class="t">${n > 0 ? n : 'GO!'}</div>`; if (n !== countShown) { countShown = n; sfx.beep(); } }
  else if (state.phase === 'race') c.innerHTML = myKart.finished ? `<div class="t">🏁</div><div class="s">Gefinisht als ${state.order.findIndex(o => o.player === me) + 1}e. Wachten op de rest…</div>` : (performance.now() - goTime < 1200 ? '<div class="t">GO!</div>' : '');
  else if (state.phase === 'done') c.innerHTML = `<div class="t">Uitslag</div><div class="s">${state.order.map((o, i) => `${i+1}. ${o.name}${o.player === me ? ' (jij)' : ''}`).join('<br>')}</div><button class="act" id="again">Nog een race</button>`;
  const solo = document.getElementById('solo'); if (solo) solo.onclick = () => ws.send(JSON.stringify({ type: 'start' }));
  const again = document.getElementById('again'); if (again) again.onclick = () => ws.send(JSON.stringify({ type: 'reset' }));
}
let goTime = -1e9;

// ---------- Loop ----------
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const camPos = new THREE.Vector3(0, 6, -12), look = new THREE.Vector3();
let last = performance.now(), hudT = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (state && state.phase === 'race' && lastPhase === 'race' && goTime < 0) goTime = now;
  if (state && state.phase !== 'race') goTime = -1e9;
  physics(dt); send(dt);
  myMesh.position.set(myKart.x, 0, myKart.z); myMesh.rotation.y = myKart.rot; myMesh.rotation.z = -myKart.steer * 0.08;
  myMesh.userData.wheels.forEach((w, i) => { w.rotation.x += myKart.speed * dt * 2.5; if (i < 2) w.rotation.y = myKart.steer * 0.4; });
  for (const m of [...botMeshes, otherMesh]) if (m.userData.target) { m.position.lerp(m.userData.target, Math.min(1, dt * 10));
    let dr = m.userData.rot - m.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); m.rotation.y += dr * Math.min(1, dt * 10); m.userData.wheels.forEach(w => w.rotation.x += dt * 20); }
  // Camera achter de kart
  const back = new THREE.Vector3(-Math.sin(myKart.rot), 0, -Math.cos(myKart.rot));
  const target = new THREE.Vector3(myKart.x, 0, myKart.z).addScaledVector(back, 9 + Math.abs(myKart.speed) * 0.08); target.y = 4.5;
  camPos.lerp(target, Math.min(1, dt * 4)); camera.position.copy(camPos);
  look.set(myKart.x + Math.sin(myKart.rot) * 6, 1.2, myKart.z + Math.cos(myKart.rot) * 6); camera.lookAt(look);
  camera.fov = 60 + myKart.boost * 10; camera.updateProjectionMatrix();
  pads.forEach(p => p.m.material.color.setHSL(0.08 + 0.04 * Math.sin(now / 150), 1, 0.5 + 0.1 * Math.sin(now / 200)));
  document.getElementById('speed').innerHTML = Math.round(Math.abs(myKart.speed) * 3.6) + ' <small>km/u</small>';
  hudT += dt; if (hudT > 0.2) { hudT = 0; renderHud(); }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
